resources:
  jobs:
    ecommerce_medallion_job:
      name: ecommerce-medallion-${bundle.target}
      description: E-commerce CSV to Bronze Silver and Gold Delta tables
      max_concurrent_runs: 1
      tags:
        project: ecommerce
        managed_by: dab
        environment: ${bundle.target}
      tasks:
        - task_key: setup_catalog
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../src/00_setup.py
            base_parameters:
              catalog: ${var.catalog}
              landing_schema: ${var.landing_schema}
              source_volume: ${var.source_volume}

        - task_key: bronze_ingestion
          depends_on:
            - task_key: setup_catalog
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../src/01_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              landing_schema: ${var.landing_schema}
              source_volume: ${var.source_volume}

        - task_key: silver_transformations
          depends_on:
            - task_key: bronze_ingestion
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../src/02_silver.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: gold_aggregations
          depends_on:
            - task_key: silver_transformations
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../src/03_gold.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: data_quality
          depends_on:
            - task_key: gold_aggregations
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../src/04_validate.py
            base_parameters:
              catalog: ${var.catalog}

